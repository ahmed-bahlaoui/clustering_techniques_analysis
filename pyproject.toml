[project]
name = "clusteringproject"
version = "0.1.0"
description = "A comparative study of clustering algorithms K-means, DBSCAN, and Agglomerative Clustering for the use of movie classification and recommendation."
readme = "README.md"
authors = [{ name = "Ahmed", email = "AhmedBahlaoui@outlook.com" }]
requires-python = ">=3.14"
dependencies = [
    "fastparquet>=2026.9.0",
    "kagglehub>=1.0.3",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "polars>=2.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "umap-learn>=0.5.12",
]

[project.scripts]
clusteringproject = "clusteringproject:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
